name: Publish Homebrew bottles
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: bottles-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@56618cab7a58e3efc9b282dd3de75bbf1075db9b
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Verify release tag belongs to CI-validated main history
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          sha=$(uv run --no-project --offline python scripts/bottle_release.py verify --tag "$RELEASE_TAG")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  bottle:
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate release tag syntax
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@56618cab7a58e3efc9b282dd3de75bbf1075db9b
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        with:
          stable: true
      - name: Prepare a stable formula pinned to the release commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          brew tap clisage/release "$GITHUB_WORKSPACE"
          uv run --no-project --offline python scripts/prepare_bottle.py \
            "$GITHUB_WORKSPACE" "$(brew --repository clisage/release)" "$RELEASE_TAG"
      - name: Build and test the bottle
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          brew install --build-bottle --yes clisage/release/clisage
          [[ "$(clisage --version)" == "clisage ${RELEASE_TAG#v}" ]]
          brew test clisage/release/clisage
          brew style "$(brew --repository clisage/release)/Formula/clisage.rb"
          mkdir dist
          cd dist
          brew bottle --json --root-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" clisage/release/clisage
          brew reinstall ./*.bottle.tar.gz
          brew test clisage/release/clisage
      - name: Sign bottle provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.bottle.tar.gz
          create-storage-record: false
      - name: Include verification material and generated formula
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/provenance.sigstore.json
          cp "$(brew --repository clisage/release)/Formula/clisage.rb" dist/clisage.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clisage-bottle-${{ inputs.release_tag }}-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: bottle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Publish only artifacts built by this trusted run, never PR artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@56618cab7a58e3efc9b282dd3de75bbf1075db9b
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clisage-bottle-${{ inputs.release_tag }}-*
          path: bottle-artifacts
      - name: Publish complete tested bottles and provenance to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --no-project --offline python scripts/bottle_release.py publish --tag "$RELEASE_TAG" --artifacts bottle-artifacts
