name: Merge verified Homebrew metadata
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Generated formula branch to verify and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: formula-publication
  cancel-in-progress: false
jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      # Use only trusted main code. Formula branch contents are inspected as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@56618cab7a58e3efc9b282dd3de75bbf1075db9b
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Verify published metadata and merge through normal branch protections
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA_BRANCH: ${{ inputs.branch }}
        run: uv run --no-project --offline python scripts/formula_publication.py publish
