[package]
name = "clisage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small shell AI assistant with secure credentials and Unix pipelines"
repository = "https://github.com/alkca/clisage"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
keyring-core = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
shell-words = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[build-dependencies]
semver = "1"

[dev-dependencies]
portable-pty = "0.9"
libc = "0.2"
semver = "1"
