[package]
name = "clisage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small shell AI assistant with secure credentials and Unix pipelines"
repository = "https://github.com/alkca/clisage"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9"
